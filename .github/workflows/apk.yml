name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;36.0.0'
      - run: ./build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/ComandoTV.apk ComandoTV.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest ComandoTV.apk --clobber
            gh release edit latest --title "Comando TV (build ${{ github.run_number }})"
          else
            gh release create latest ComandoTV.apk --title "Comando TV (build ${{ github.run_number }})" --notes "Instala no telemóvel Android. As versões novas instalam por cima."
          fi
      - uses: actions/upload-artifact@v4
        with: { name: ComandoTV-apk, path: ComandoTV.apk }
